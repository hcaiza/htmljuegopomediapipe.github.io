<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cuatro manos · Monedas</title>
<style>
:root{--c0:#ff5d73;--c1:#ffc233;--c2:#35d49a;--c3:#4aa8ff;--bg:#10142b;--b:clamp(92px,24vmin,180px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.35;display:none}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cross:before,.cross:after{content:"";position:fixed;background:rgba(255,255,255,.12);z-index:1}
.cross:before{left:50%;top:0;width:2px;height:100%}
.cross:after{top:50%;left:0;height:2px;width:100%}

/* Botones flotantes */
.btn{position:fixed;width:var(--b);height:var(--b);z-index:5;border:0;padding:0;background:none;color:#fff;cursor:pointer;animation:float 3s ease-in-out infinite}
.btn[data-q="0"]{top:calc(env(safe-area-inset-top,0px) + 3vmin);left:3vmin;--col:var(--c0)}
.btn[data-q="1"]{top:calc(env(safe-area-inset-top,0px) + 3vmin);right:3vmin;--col:var(--c1);animation-delay:-.7s}
.btn[data-q="2"]{bottom:calc(env(safe-area-inset-bottom,0px) + 3vmin);left:3vmin;--col:var(--c2);animation-delay:-1.4s}
.btn[data-q="3"]{bottom:calc(env(safe-area-inset-bottom,0px) + 3vmin);right:3vmin;--col:var(--c3);animation-delay:-2.1s}
@keyframes float{50%{translate:0 -10px}}
.face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6 0,transparent 40%),var(--col);
  box-shadow:0 12px 0 rgba(0,0,0,.28),0 0 0 4px rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .08s,box-shadow .08s}
.face b{font-size:calc(var(--b)*.34);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.face small{font-size:calc(var(--b)*.12);opacity:.9;font-weight:600}
.btn.down .face,.btn.held .face{transform:translateY(8px) scale(.92);box-shadow:0 3px 0 rgba(0,0,0,.28),0 0 0 6px #fff,0 0 40px var(--col)}
.btn.nocoin .face{animation:shake .25s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}

/* Moneda */
#coin{position:fixed;left:50%;top:50%;width:calc(var(--b)*.8);height:calc(var(--b)*.8);margin:calc(var(--b)*-.4) 0 0 calc(var(--b)*-.4);z-index:4;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.6);transform:scale(0);
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .3s;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
#coin span{display:block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}

/* Barra de estado */
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2vmin);left:50%;translate:-50% 0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100vw - 2*var(--b) - 24px);text-align:center}
#start{background:#fff;color:#10142b;border:0;border-radius:99px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#start:disabled{opacity:.6}
#msg{font-size:13px;opacity:.85;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:12px}
.pop{position:fixed;z-index:7;font-weight:800;font-size:28px;pointer-events:none;animation:up .7s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<div class="cross"></div>
<canvas id="cv"></canvas>

<div id="bar">
  <button id="start">📷 Activar manos (MediaPipe)</button>
  <div id="msg">Toca los botones o activa la cámara y cierra el puño en tu esquina.</div>
</div>

<button class="btn" data-q="0" aria-label="Arriba izquierda"><div class="face"><b>0</b><small>↖ Arriba izq.</small></div></button>
<button class="btn" data-q="1" aria-label="Arriba derecha"><div class="face"><b>0</b><small>↗ Arriba der.</small></div></button>
<button class="btn" data-q="2" aria-label="Abajo izquierda"><div class="face"><b>0</b><small>↙ Abajo izq.</small></div></button>
<button class="btn" data-q="3" aria-label="Abajo derecha"><div class="face"><b>0</b><small>↘ Abajo der.</small></div></button>

<div id="coin"><span>🪙</span></div>

<script type="module">
const $ = s => document.querySelector(s);
const btns = [...document.querySelectorAll('.btn')];
const coin = $('#coin'), msg = $('#msg'), video = $('#video'), cv = $('#cv'), ctx = cv.getContext('2d');
const colors = ['#ff5d73', '#ffc233', '#35d49a', '#4aa8ff'];
const scores = [0, 0, 0, 0];
let coinOn = false;

/* ---------- Juego ---------- */
function spawn() {
  coin.style.transition = 'none'; coin.style.opacity = 1; coin.style.transform = 'scale(0)';
  void coin.offsetWidth;
  coin.style.transition = ''; coin.style.transform = 'scale(1)';
  coinOn = true;
}
function press(q) {
  const b = btns[q];
  b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 160);
  if (!coinOn) { b.classList.add('nocoin'); setTimeout(() => b.classList.remove('nocoin'), 260); return; }
  coinOn = false;
  scores[q]++;
  b.querySelector('b').textContent = scores[q];
  // la moneda vuela hacia el botón
  const r = b.getBoundingClientRect();
  const dx = r.left + r.width / 2 - innerWidth / 2, dy = r.top + r.height / 2 - innerHeight / 2;
  coin.style.transition = 'transform .45s ease-in,opacity .45s';
  coin.style.transform = `translate(${dx}px,${dy}px) scale(.3)`; coin.style.opacity = 0;
  const p = document.createElement('div');
  p.className = 'pop'; p.textContent = '+1'; p.style.color = colors[q];
  p.style.left = r.left + r.width / 2 - 14 + 'px'; p.style.top = r.top + 'px';
  document.body.appendChild(p); setTimeout(() => p.remove(), 700);
  setTimeout(spawn, 800);
}
spawn();

/* ---------- Táctil / mouse (multitáctil con pointer events) ---------- */
btns.forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); press(+b.dataset.q); }));

/* ---------- MediaPipe ---------- */
const VER = '0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
let landmarker = null, lastT = -1;
const held = [false, false, false, false], lastFist = [0, 0, 0, 0];

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

// Coordenada normalizada del video -> pantalla (espejo + object-fit: cover)
function toScreen(nx, ny) {
  const vw = video.videoWidth, vh = video.videoHeight, W = innerWidth, H = innerHeight;
  const s = Math.max(W / vw, H / vh);
  const x = (1 - nx) * vw * s - (vw * s - W) / 2;
  const y = ny * vh * s - (vh * s - H) / 2;
  return [x, y];
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function isFist(lm) {
  let curled = 0;
  for (const [tip, mcp] of [[8, 5], [12, 9], [16, 13], [20, 17]])
    if (dist(lm[tip], lm[0]) < dist(lm[mcp], lm[0]) * 1.2) curled++;
  return curled >= 3;
}

function process(hands) {
  const now = performance.now(), fistQ = [false, false, false, false];
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const lm of hands) {
    const ids = [0, 5, 9, 13, 17];
    const cx = ids.reduce((s, i) => s + lm[i].x, 0) / 5, cy = ids.reduce((s, i) => s + lm[i].y, 0) / 5;
    const [x, y] = toScreen(cx, cy);
    const q = (y > innerHeight / 2 ? 2 : 0) + (x > innerWidth / 2 ? 1 : 0);
    const fist = isFist(lm);
    if (fist) fistQ[q] = true;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (const p of lm) { const [px, py] = toScreen(p.x, p.y); ctx.beginPath(); ctx.arc(px, py, 3, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, y, fist ? 26 : 18, 0, 7);
    ctx.lineWidth = 5; ctx.strokeStyle = fist ? '#ff4d4d' : colors[q]; ctx.stroke();
  }
  for (let q = 0; q < 4; q++) {
    if (fistQ[q]) {
      if (!held[q]) { held[q] = true; btns[q].classList.add('held'); press(q); }
      lastFist[q] = now;
    } else if (held[q] && now - lastFist[q] > 150) { // pequeña tolerancia anti-parpadeo
      held[q] = false; btns[q].classList.remove('held');
    }
  }
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    const r = landmarker.detectForVideo(video, performance.now());
    process(r.landmarks || []);
  }
  requestAnimationFrame(loop);
}

$('#start').addEventListener('click', async e => {
  const t = e.currentTarget; t.disabled = true;
  try {
    msg.textContent = 'Pidiendo cámara…';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
    video.srcObject = stream; await video.play(); video.style.display = 'block';
    msg.textContent = 'Cargando MediaPipe…';
    const { HandLandmarker, FilesetResolver } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/+esm`);
    const fs = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
    const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numHands: 4 });
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    t.style.display = 'none';
    msg.textContent = '¡Listo! Cierra el puño en tu esquina para pulsar tu botón.';
    loop();
  } catch (err) {
    console.error(err);
    t.disabled = false;
    msg.textContent = 'No se pudo usar la cámara/MediaPipe. Puedes seguir jugando con toques.';
  }
});
</script>
</body>
</html>
